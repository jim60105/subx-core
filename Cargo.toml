[package]
name = "subx-core"
version = "1.0.0"
edition = "2024"
authors = ["Jim Chen <Jim@ChenJ.im>"]
description = "Core subtitle processing library for SubX: matching, format conversion, synchronization, and AI service integrations."
license = "GPL-3.0-or-later"
repository = "https://github.com/jim60105/subx-core"
homepage = "https://github.com/jim60105/subx-core"
keywords = ["subtitle", "library", "ai", "video"]
categories = ["multimedia", "text-processing"]

exclude = [
    "assets/",
    ".github/",
    "tests/",
    "target/",
    "*.mp4",
    "*.mp3",
    "*.mov",
    "*.avi",
    "*.mkv",
    "benches/",
    "**/*.log",
    "**/*.tmp",
    "**/.DS_Store",
    "Cargo.lock",
]

[package.metadata.docs.rs]
# Deliberately NOT all-features: activating `test-support` would present
# ~1,930 LOC of relocated test scaffolding (subx_core::test_support::*) as
# documented public API and pull wiremock/hound into the documentation
# build. `archive-rar` is the only feature meant to appear in the public
# docs. See refresh-docs-for-two-crate-architecture design.md Decision 5.
features = ["archive-rar"]
rustdoc-args = ["--cfg", "docsrs"]

# 'slow-tests' gates long-running format round-trip tests;
# 'archive-rar' enables optional RAR archive extraction via `dep:unrar`;
# 'test-support' exposes `src/test_support/` (shared test fixtures for the
# subx-cli test suite) and pulls in the HTTP mock server and WAV writer that
# only that module needs.
[features]
default = []
slow-tests = []
archive-rar = ["dep:unrar"]
test-support = ["dep:wiremock", "dep:hound"]

# Documentation quality linting
[lints.rustdoc]
broken_intra_doc_links = "deny"
private_doc_tests = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"

[lints.clippy]
missing_docs_in_private_items = "allow" # Allow missing private docs
doc_markdown = "allow"                  # Allow markdown formatting warnings

[lints.rust]
missing_docs = "allow" # Allow missing docs at rust level

[dependencies]
# Subtitle format parsing dependencies
regex = "1.0"
encoding_rs = "0.8"

# Async runtime
tokio = { version = "1.0", features = [
    "rt",
    "sync",
    "time",
    "fs",
    "macros",
] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"

# Configuration management
config = "0.15"

# HTTP client
reqwest = { version = "0.13", features = ["json", "stream", "rustls"] }

# File scanning
walkdir = "2.3"

# URL parsing and validation
url = "2"

# Parallel processing support
futures = "0.3"

# Async trait support
async-trait = "0.1"
uuid = { version = "1.3", features = ["v7"] }

# Logging. `std` is `log`'s default feature, but the audio-stack dependencies
# disable it graph-wide; this crate's own test module installs a boxed logger
# (`log::set_boxed_logger` in src/config/service.rs), which lives behind
# `std`. Inside subx-cli the feature arrived via env_logger — a pass-through
# this standalone crate must not rely on.
log = { version = "0.4", features = ["std"] }

# Audio processing
symphonia = { version = "0.5", default-features = false, features = [
    "isomp4",
    "mkv",
    "ogg",
    "wav",
    "aac",
    "flac",
    "mp3",
    "pcm",
    "vorbis",
] }

# VAD
voice_activity_detector = { version = "0.2.1", features = [
    "async",
] }
rubato = "2.0"
audioadapter-buffers = "3"

# Configuration management dependencies: path resolution and multi-core detection
dirs = "6.0"
num_cpus = "1.0"

# Archive extraction
zip = "8"
unrar = { version = "0.5", optional = true }
tar = "0.4"
flate2 = "1"
tempfile = "3.10"
sevenz-rust2 = "0.22.2"

# Activated only by `test-support` (see [features] and the [dev-dependencies]
# note below); a build without the feature never resolves them.
wiremock = { version = "0.6", optional = true }
hound = { version = "3.5", optional = true }

# Test-only dependencies.
#
# `wiremock` and `hound` appear twice by design: `optional = true` under
# [dependencies] so the `test-support` feature can activate them for
# `src/test_support/`, and again under [dev-dependencies] so this crate's own
# integration tests can name them directly. That is the ordinary Cargo shape
# for a dependency used both behind a feature and by tests, not a duplication.
#
# `subx-core = { path = "." }` under [dev-dependencies] is how this crate's
# integration tests reach the `test-support`-gated module: an integration
# test links the library as an external crate, which `#[cfg(test)]` never
# covers. The declaration carries no `version` key, so `cargo package` strips
# it from the published manifest and no consumer ever sees it.
[dev-dependencies]
# vad_detector_tests drives a multi_thread flavor under slow-tests; dev-dep
# features unify only into test builds, so the library target stays rt-only.
tokio = { version = "1.0", features = ["rt-multi-thread"] }
mockall = "0.13"
wiremock = "0.6"
hound = "3.5"
criterion = { version = "0.6.0", features = ["html_reports"] }
pretty_assertions = "1.4"
subx-core = { path = ".", features = ["test-support"] }

[[bench]]
name = "retry_performance"
harness = false

[[bench]]
name = "file_id_generation_bench"
harness = false
